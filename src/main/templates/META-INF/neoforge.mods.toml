# Carta d'identita' della mod: NeoForge la legge prima di caricare qualsiasi codice.
modLoader = "javafml"          # il "caricatore" standard per mod Java
loaderVersion = "[4,)"         # versione minima del loader javafml (quella di NeoForge 21.1)
license = "${mod_license}"

# Le mixin (piccole modifiche al codice di Minecraft) di questa mod.
[[mixins]]
config = "specialmobs.mixins.json"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
description = '''${mod_description}'''

# Dipendenze: NeoForge e Minecraft devono esserci, nelle versioni indicate.
[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "[${neo_version},)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "[${minecraft_version}]"
ordering = "NONE"
side = "BOTH"
