plugins {
    id 'java'
    // ModDevGradle: il plugin ufficiale NeoForge per sviluppare mod.
    // Scarica Minecraft + NeoForge, li decompila e configura le "run" per provare la mod.
    id 'net.neoforged.moddev' version '2.0.78'
}

group = 'fathertoast.specialmobs'
version = mod_version

// Minecraft 1.21.1 richiede Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = neo_version

    // File con i permessi extra su classi/campi privati di Minecraft (vedi il file per i dettagli).
    accessTransformers.from 'src/main/resources/META-INF/accesstransformer.cfg'

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }
        server {
            server()
            programArgument '--nogui'
        }
    }

    mods {
        // Dice a NeoForge che il codice di "main" e' la mod chiamata specialmobs.
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

// Sostituisce ${mod_id}, ${mod_version}... dentro neoforge.mods.toml con i valori di gradle.properties.
var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
            minecraft_version: minecraft_version,
            neo_version      : neo_version,
            mod_id           : mod_id,
            mod_name         : mod_name,
            mod_version      : mod_version,
            mod_license      : mod_license,
            mod_authors      : mod_authors,
            mod_description  : mod_description
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

dependencies {
    // Jade: serve SOLO per compilare il plugin dei ninja (common/compat/jade). Non viene incluso nel nostro jar.
    // Metti il jar di Jade (quello del modpack) nella cartella libs/; non viene salvato su GitHub.
    compileOnly fileTree( dir: 'libs', include: ['Jade-*.jar'] )
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs << '-Xmaxerrs' << '2000' // mostra tutti gli errori, non solo i primi 100
    options.compilerArgs << '-g:source,lines' // meno debug info = jar piu' piccolo
}
